# Continuous integration for the SANAD Teacher platform.
#
# NOTE ON THE REPOSITORY STATE: at the time this file was added the working tree
# was not yet under git. The workflow is still committed as real tooling — it
# becomes active the moment the project is pushed to GitHub, and until then it
# doubles as the executable description of "what must pass before a change is
# accepted". Everything it runs is also runnable locally with the exact same
# commands (see frontend/README.md and backend/tests/README.md), so nothing here
# is CI-only magic.
#
# The two jobs are independent on purpose (backend has no Node dependency and
# frontend has no PHP dependency), so they run in parallel and a failure points
# at one side of the stack.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # 8.3 matches composer.json's "php": "^8.3" constraint and the local dev
      # runtime (PHP 8.3.30).
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # --no-interaction + --prefer-dist for reproducibility. Dev dependencies
      # ARE installed here (unlike a production deploy, which uses
      # --no-dev --optimize-autoloader — see docs/DEPLOYMENT.md) because PHPUnit
      # is a require-dev package.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # `composer lint` runs `php -l` over every .php file in the project except
      # vendor/, storage/ and node_modules/ (script defined in composer.json).
      - name: PHP syntax check
        run: composer lint

      # Unit suite only (phpunit.xml registers tests/Unit). These tests are pure
      # and need no MySQL service, no .env and no running web server, which is
      # what keeps this job free of a database container. The DB-backed
      # verification scripts under backend/tests/concurrency are intentionally
      # NOT run here — see backend/tests/README.md.
      - name: PHPUnit (unit suite)
        run: composer test

      # Advisories against the locked PHP dependencies. This one is a hard gate:
      # the backend dependency tree is tiny (vlucas/phpdotenv plus PHPUnit's
      # dev-only tree), so any advisory here is worth stopping for.
      - name: Composer security audit
        run: composer audit

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS. Vite 6 requires Node 18+/20+; 22 is the current LTS line.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a
      # drifting transitive version can never be introduced by CI itself.
      - name: Install npm dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      # --- npm audit policy -------------------------------------------------
      #
      # Deliberately TWO steps with different strictness, because a single
      # `npm audit` (which fails on any advisory at any level) would make CI
      # hostage to every future low-severity advisory in a transitive dev
      # dependency — including ones with no published fix, which no change to
      # this repository could ever resolve.
      #
      # THE POLICY:
      #   1. HIGH and CRITICAL advisories FAIL the build. This is Part 8's
      #      acceptance criterion for this remediation and is enforced by
      #      `npm audit --audit-level=high` below.
      #   2. moderate/low advisories are REPORTED, never fatal. The second step
      #      always runs and always exits 0; its output is there for a human to
      #      read in the job log.
      #
      # Escape hatch, to be used consciously and never silently: if a HIGH
      # advisory genuinely has no available fix, add the advisory id to an
      # explicit, dated, commented allow-list here (or `npm audit --omit=dev`
      # if it is dev-only and unreachable at runtime) rather than lowering the
      # audit level for everything.
      - name: npm audit (high+ fails the build)
        run: npm audit --audit-level=high

      - name: npm audit (moderate/low — report only)
        if: always()
        run: npm audit --audit-level=low || true
