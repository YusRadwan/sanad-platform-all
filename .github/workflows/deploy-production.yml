name: Deploy Sanad to Hostinger

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to deploy"
        required: true
        type: choice
        options:
          - main
          - test/video-providers

permissions:
  contents: read

concurrency:
  group: sanad-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build
        run: |
          test -s frontend/dist/index.html
          test -d frontend/dist/assets
          echo "BUILD_VERIFIED"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Resolve remote home directory
        id: remote
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          REMOTE_HOME=$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'printf "%s" "$HOME"')
          test -n "$REMOTE_HOME"
          echo "home=$REMOTE_HOME" >> "$GITHUB_OUTPUT"

      - name: Create remote backup
        id: backup
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          BACKUP_PATH=$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -e
          RUN_ID="$1"
          mkdir -p "$HOME/sanad-backups"
          BACKUP="$HOME/sanad-backups/public_html-before-$RUN_ID.tar.gz"
          tar -czf "$BACKUP" -C "$HOME/domains/orchid-gerbil-115887.hostingersite.com" public_html
          printf "%s" "$BACKUP"
          REMOTE
          )
          test -n "$BACKUP_PATH"
          echo "backup_path=$BACKUP_PATH" >> "$GITHUB_OUTPUT"
          echo "REMOTE_BACKUP_CREATED"

      - name: Package frontend
        run: tar -czf "/tmp/sanad-dist-${GITHUB_RUN_ID}.tar.gz" -C frontend/dist .

      - name: Upload release package
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_HOME: ${{ steps.remote.outputs.home }}
        run: |
          RELEASE="sanad-release-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_HOME/$RELEASE'"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "/tmp/sanad-dist-${GITHUB_RUN_ID}.tar.gz" \
            "$SSH_USER@$SSH_HOST:$REMOTE_HOME/$RELEASE/dist.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "tar -xzf '$REMOTE_HOME/$RELEASE/dist.tar.gz' -C '$REMOTE_HOME/$RELEASE'"

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_HOME: ${{ steps.remote.outputs.home }}
        run: |
          RELEASE="sanad-release-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$REMOTE_HOME/$RELEASE'" <<'REMOTE'
          set -e
          DIST="$1"
          ROOT="$HOME/domains/orchid-gerbil-115887.hostingersite.com/public_html"

          test -s "$DIST/index.html"
          test -d "$DIST/assets"
          mkdir -p "$ROOT/assets"
          cp -a "$DIST/assets/." "$ROOT/assets/"

          if [ -d "$DIST/branding" ]; then
            mkdir -p "$ROOT/branding"
            cp -a "$DIST/branding/." "$ROOT/branding/"
          fi

          # Publish the new entry point last.
          cp "$DIST/index.html" "$ROOT/index.html"
          echo DEPLOY_FILES_UPDATED
          REMOTE

      - name: Smoke test
        run: |
          SITE="https://orchid-gerbil-115887.hostingersite.com"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$SITE/" -o /tmp/sanad-index.html &&
               grep -qi '<html' /tmp/sanad-index.html; then
              echo "SITE_HTTP_OK"
              exit 0
            fi
            sleep 5
          done
          echo "SMOKE_TEST_FAILED"
          exit 1

      - name: Roll back public_html on failure
        if: failure() && steps.backup.outputs.backup_path != ''
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$BACKUP_PATH'" <<'REMOTE'
          set -e
          BACKUP_PATH="$1"
          tar -xzf "$BACKUP_PATH" -C "$HOME/domains/orchid-gerbil-115887.hostingersite.com"
          echo ROLLBACK_COMPLETED
          REMOTE

      - name: Clean up uploaded release
        if: always() && steps.remote.outputs.home != ''
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_HOME: ${{ steps.remote.outputs.home }}
        run: |
          RELEASE="sanad-release-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "rm -rf '$REMOTE_HOME/$RELEASE'" || true
