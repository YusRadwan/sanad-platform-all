name: Validate Video Watch Session Analytics

on:
  push:
    branches:
      - feature/video-watch-session-analytics
  pull_request:
    branches:
      - feature/video-watch-session-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: |
          find backend/app backend/routes backend/database/migrations backend/tests \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l
