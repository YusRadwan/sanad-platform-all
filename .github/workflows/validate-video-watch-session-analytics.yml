name: Validate Video Watch Session Analytics

on:
  push:
    branches:
      - feature/video-watch-session-analytics
  pull_request:
    branches:
      - feature/video-watch-session-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sanad_platform_v2_test
          MYSQL_USER: sanad_local
          MYSQL_PASSWORD: sanad_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_PASSWORD: sanad_test_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: |
          find backend/app backend/routes backend/database/migrations backend/tests \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install backend dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force

      - name: Run focused backend feature tests
        working-directory: backend
        run: vendor/bin/phpunit --testsuite=Feature --filter='VideoStatisticsTest|LessonProgressTest'
